<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAligator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="chat-container">
    <header class="chat-header">
        <img src="logo.png" alt="Logo" class="chat-logo">
        <span>IAligator</span>
    </header>

    <main class="chat-history" id="chatHistory" aria-live="polite">
        <div class="message ai-message">
            Olá! Faça uma pergunta sobre as Copas do Mundo!
        </div>
    </main>

    <footer class="chat-input-area">
        <input type="text" id="questionInput" placeholder="Digite sua pergunta..." autocomplete="off" />
        <button type="button" id="sendButton">Enviar</button>
    </footer>
    </div>
</body>
</html>
