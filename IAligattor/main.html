<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAlligator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
    <header class="chat-header">
        <img src="logo.png" alt="Logo" class="chat-logo">
        <span>IAlligator</span>
    </header>

<main class="chat-history" id="chatHistory">
    <div class="message user-message">
        Exemplo de mensagem do usuário
    </div>

    <div class="message ai-message">
        Exemplo de mensagem da IA
    </div>
</main>

<footer class="chat-input-area">
    <input type="text" id="questionInput" placeholder="Digite sua pergunta..." />
    <button type="button" id="sendButton">Enviar</button>
</footer>
    </div>
<script src="script.js"></script>
</body>
</html>
